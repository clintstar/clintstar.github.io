<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clintstar AgroConnect - Pi Auth</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <div id="app" style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h1>Clintstar AgroConnect</h1>
    <p id="status">Initializing Pi Network...</p>
    <button id="signin-btn" style="display:none; padding: 10px 20px; font-size: 16px; cursor: pointer;" onclick="triggerAuth()">Sign in with Pi</button>
  </div>

  <script>
    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    async function authenticatePi() {
      const statusEl = document.getElementById('status');
      const signinBtn = document.getElementById('signin-btn');

      try {
        statusEl.textContent = 'Initializing Pi SDK...';
        // Ensure Pi.init is awaited as a promise
        await Pi.init({ version: "2.0" });

        statusEl.textContent = 'Authenticating with Pi...';
        // Use the "username" scope
        const authResult = await Pi.authenticate(['username'], onIncompletePaymentFound);

        statusEl.textContent = 'Sending token to backend for validation...';

        // Send the access token to the backend for validation and session establishment
        const resp = await fetch('/api/auth/pi', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ accessToken: authResult.accessToken })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err && err.error ? err.error : 'Server failed to validate token with Pi');
        }

        const sessionData = await resp.json();

        statusEl.textContent = `Welcome, ${sessionData.user.username}! Authentication successful.`;
        signinBtn.style.display = 'none';

      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Authentication failed. Please try again.';
        signinBtn.style.display = 'inline-block';
      }
    }

    function triggerAuth() {
      authenticatePi();
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Trigger authentication automatically when the app loads
      authenticatePi();
    });
  </script>
</body>
</html>
