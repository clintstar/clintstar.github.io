<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clintstar AgroConnect - Pi Auth</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <div id="app" style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h1>Clintstar AgroConnect</h1>
    <p id="status">Initializing Pi Network...</p>
    <button id="signin-btn" style="display:none; padding: 10px 20px; font-size: 16px; cursor: pointer;" onclick="triggerAuth()">Sign in with Pi</button>
  </div>

  <script>
    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    async function authenticatePi() {
      const statusEl = document.getElementById('status');
      const signinBtn = document.getElementById('signin-btn');

      try {
        statusEl.textContent = 'Initializing Pi SDK...';
        await Pi.init({ version: "2.0" });

        statusEl.textContent = 'Authenticating with Pi...';
        const authResult = await Pi.authenticate(['username'], onIncompletePaymentFound);
        
        statusEl.textContent = 'Validating token with Pi servers...';
        
        // Directly validate the access token against Pi's API to bypass missing backend server
        const piResponse = await fetch('https://api.minepi.com/v2/me', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${authResult.accessToken}`
          }
        });

        if (!piResponse.ok) {
          throw new Error('Failed to verify token with Pi network');
        }

        const userData = await piResponse.json();
        statusEl.textContent = `Welcome, ${userData.username}! Authentication successful.`;
        signinBtn.style.display = 'none';

      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Authentication failed. Please try again.';
        signinBtn.style.display = 'inline-block';
      }
    }

    function triggerAuth() {
      authenticatePi();
    }

    window.addEventListener('DOMContentLoaded', () => {
      authenticatePi();
    });
  </script>
</body>
</html>
